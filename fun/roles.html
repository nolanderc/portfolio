<!DOCTYPE html>
<html>

<head>
    <title>Random Role Assignment</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }

        button {
            color: black;
            height: 40px;
            width: 100px;
            border-radius: 4px;
        }

        #next {
            height: 50px;
            width: 150px;
        }

        #add_role {
            background-color: #75df75;
        }

        #start,
        #next {
            background-color: #90c8da;
        }

        .delete,
        #reset {
            background-color: #e4999d;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            color: gray;
            opacity: 0.6;
        }

        input {
            width: 100px;
            height: 30px;
        }

        input[type="number"] {
            width: 50px;
            height: 30px;
        }

        #config,
        #assignment {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #display {
            font-size: 40px;
            height: 300px;
            text-align: center;
            line-height: 300px
        }
    </style>
</head>

<body>
    <div id="config">
        <h2>Roles</h2>
        <div>
            <button id="add_role">Add Role</button>
            <button id="start">Start</button>
            <button id="reset">Reset</button>
        </div>
        <div id="roles"></div>
        <div id="total"></div>
    </div>

    <div id="assignment">
        <h2>Assignment</h2>
        <button id="next">Next</button>
        <div id="display"></div>
    </div>

    <script src="roles.js"></script>
</body>

</html>
